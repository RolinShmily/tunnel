proxies:
  - name: Reality
    type: vless
    server: <node-address>
    port: 443
    uuid: <uuid>
    udp: true
    tls: true
    network: tcp
    flow: xtls-rprx-vision
    servername: <reality-sni>
    client-fingerprint: chrome
    reality-opts:
      public-key: <reality-public-key>
      short-id: <reality-short-id>
    # disable smux for xtls-rprx-vision
    smux:
      enabled: false

  - name: Hysteria2
    type: hysteria2
    server: <node-address>
    port: 27015
    password: <hy2-password>
    sni: <hy2-sni>
    skip-cert-verify: false

  - name: CF-CDN
    type: vless
    server: <cf-domain>
    port: 8443
    uuid: <ws-uuid>
    udp: true
    tls: true
    network: ws
    servername: <ws-sni>
    client-fingerprint: chrome
    ws-opts:
      path: <ws-path>
      headers:
        Host: <ws-sni>
      max-early-data: 2048
      early-data-header-name: Sec-WebSocket-Protocol

  - name: Direct
    type: direct
    udp: true

mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: info
keep-alive-idle: 600
keep-alive-interval: 15

profile:
  store-selected: true
  store-fake-ip: true

ntp:
  enable: true
  write-to-system: false

external-controller: 0.0.0.0:9091
secret: <api-secret>
external-ui: ui
external-ui-name: metacubexd
external-ui-url: "https://gh-proxy.com/https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"

tun:
  enable: true
  stack: system
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-redirect: true # transparent gateway redirect for LAN (Linux nftables)
  auto-detect-interface: true
  strict-route: true
  route-exclude-address:
    - 192.168.0.0/16
    - 172.16.0.0/12
    - 10.0.0.0/8
    - 100.64.0.0/10

sniffer:
  enable: true
  override-destination: false
  force-dns-mapping: false
  parse-pure-ip: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
  skip-domain:
    - Mijia Cloud
    - dlg.io.mi.com
    - +.push.apple.com

dns:
  enable: true
  listen: 0.0.0.0:1053 # avoid conflict with dnsmasq/systemd-resolved on :53
  cache-algorithm: arc
  prefer-h3: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-ttl: 10
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter-mode: blacklist
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - https://223.5.5.5/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver-follow-policy: true
  nameserver-policy:
    '+.ts.net':
      - 100.100.100.100
    'gh-proxy.com,+.gh-proxy.com':
      - https://dns.alidns.com/dns-query#disable-qtype-65=true
      - https://doh.pub/dns-query#disable-qtype-65=true
    'tailscale.com,+.tailscale.com,tailscale.io,+.tailscale.io':
      - https://8.8.8.8/dns-query#Proxy&disable-qtype-65=true
    rule-set:custom_direct,cn_domain,private_domain,fakeipfilter_cn,steamcn_domain,microsoftcn_domain,applecn_domain:
      - https://dns.alidns.com/dns-query#disable-qtype-65=true
      - https://doh.pub/dns-query#disable-qtype-65=true
    rule-set:fakeipfilter_!cn:
      - https://8.8.8.8/dns-query#Proxy&disable-qtype-65=true
  nameserver:
    - https://8.8.8.8/dns-query#Proxy&ecs=223.5.5.0/24
  fake-ip-filter:
    - rule-set:tailscale
    - '+.tailscale.com'
    - '+.tailscale.io'
    - rule-set:custom_direct
    - rule-set:fakeipfilter_cn
    - rule-set:fakeipfilter_!cn
    - rule-set:private_domain
    - rule-set:cn_domain
    - rule-set:microsoftcn_domain
    - rule-set:applecn_domain
    - rule-set:steamcn_domain

proxy-groups:
  - name: Proxy
    type: select
    proxies:
      - Auto
      - Reality
      - Hysteria2
      - CF-CDN
      - Direct

  - name: Auto
    type: fallback
    url: https://www.gstatic.com/generate_204
    interval: 300
    lazy: true
    timeout: 3000
    proxies:
      - Reality
      - Hysteria2
      - CF-CDN
      - Direct

rules:
  # direct mirror to avoid cold-start deadlock
  - DOMAIN-KEYWORD,gh-proxy,Direct
  - DOMAIN-SUFFIX,gh-proxy.com,Direct

  - RULE-SET,private_ip,Direct,no-resolve
  - RULE-SET,private_domain,Direct
  - IP-CIDR6,fd7a:115c:a1e0::/48,Direct,no-resolve

  # reject public IPv6 for IPv4-only fallback
  - IP-CIDR6,::/0,REJECT,no-resolve

  - RULE-SET,tailscale,Direct

  - RULE-SET,custom_direct,Direct
  # drop non-CN QUIC (UDP 443) for HTTP/2 fallback
  - AND,((NETWORK,udp),(DST-PORT,443),(NOT,((RULE-SET,cn_domain)))),REJECT
  - RULE-SET,custom_proxy,Proxy

  - RULE-SET,ai_domain,Proxy
  - RULE-SET,youtube_domain,Proxy
  - RULE-SET,google_domain,Proxy
  - RULE-SET,github_domain,Proxy
  - RULE-SET,onedrive_domain,Proxy
  - RULE-SET,microsoftcn_domain,Direct
  - RULE-SET,microsoft_domain,Proxy
  - RULE-SET,applecn_domain,Direct
  - RULE-SET,apple_domain,Proxy
  - RULE-SET,telegram_domain,Proxy
  - RULE-SET,tiktok_domain,Proxy
  - RULE-SET,netflix_domain,Proxy
  - RULE-SET,paypal_domain,Proxy
  - RULE-SET,binance_domain,Proxy
  - RULE-SET,okx_domain,Proxy
  - RULE-SET,usd_domain,Proxy
  - RULE-SET,steamcn_domain,Direct
  - RULE-SET,steam_domain,Proxy
  - RULE-SET,cn!_domain,Proxy
  - RULE-SET,cn_domain,Direct
  - RULE-SET,google_ip,Proxy,no-resolve
  - RULE-SET,apple_ip,Proxy,no-resolve
  - RULE-SET,telegram_ip,Proxy,no-resolve
  - RULE-SET,netflix_ip,Proxy,no-resolve
  - RULE-SET,cn_ip,Direct

  - MATCH,Proxy

